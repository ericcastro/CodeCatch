name: Site

on:
  push:
    branches: [main]
    paths: [site/**, functions/**, scripts/check-site.py, .github/workflows/site.yml]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ugzv/CodeCatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check pages
        run: python3 scripts/check-site.py
      # Run from the repo root: wrangler deploys ./functions (install counting) with site/.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.147.0 pages deploy site --project-name codecatch --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

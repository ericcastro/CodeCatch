name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [site/**, '**.md']
  pull_request:
    paths-ignore: [site/**, '**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Settings in ruff.toml; the same version locally gives the same result.
      - name: Ruff
        run: |
          pipx run ruff==0.16.8 check scripts
          pipx run ruff==0.16.8 format --check scripts

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The Liquid Glass APIs need the macOS 26 SDK; the image defaults to an older Xcode.
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Release privacy tests
        run: python3 scripts/test-release-privacy.py
      - name: Test
        run: scripts/test.sh --force-resolved-versions
      - name: Build release
        run: |
          swift build -c release --scratch-path .build-release --force-resolved-versions \
            -Xswiftc -debug-prefix-map -Xswiftc "$PWD=/src" \
            -Xswiftc -file-prefix-map -Xswiftc "$PWD=/src"
          BIN="$(swift build -c release --scratch-path .build-release --show-bin-path)"
          xcrun strip -S "$BIN/CodeCatch" "$BIN/CodeCatchCLI"
          python3 scripts/check-release-privacy.py "$BIN/CodeCatch" "$BIN/CodeCatchCLI"
      - name: CLI runs
        run: '"$(swift build -c release --scratch-path .build-release --show-bin-path)/CodeCatchCLI" --version | grep -q "codecatch dev"'
